name: Test and publish
on:
  push: { branches: [main, 'platform/**'] }
  pull_request:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: "pages-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - name: The server starts and serves the office
        shell: bash
        run: |
          PORT=4477 node server/index.js & SRV=$!
          for i in $(seq 1 30); do curl -sf localhost:4477/ -o /dev/null && break; sleep 1; done
          for u in / /app.js /three/build/three.module.js /avatars/clips.bin /api/state /api/layout; do curl -sf "localhost:4477$u" -o /dev/null && echo "ok $u"; done
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is 'localhost:4477/..%5cpackage.json')" = 403 || test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is 'localhost:4477/..%5cpackage.json')" = 404
          kill $SRV
      - name: The notification command runs
        shell: bash
        continue-on-error: true
        run: node -e "import('./server/platform.js').then(({notifyCommand})=>{const [c,a,o]=notifyCommand('Office','test');const r=require('node:child_process').spawnSync(c,a,{...o,encoding:'utf8'});console.log(process.platform,'exit',r.status,r.error?.code??'',(r.stderr??'').slice(0,400));process.exit(r.status??1)})"
      - name: The Windows installer installs, serves and uninstalls
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install-windows.ps1
          $ok = $false; foreach ($i in 1..30) { try { $r = Invoke-WebRequest -UseBasicParsing http://localhost:4455/; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}; Start-Sleep 1 }
          powershell -ExecutionPolicy Bypass -File scripts\install-windows.ps1 uninstall
          if (-not $ok) { Get-ScheduledTask 'Agentloft' -ErrorAction SilentlyContinue | Get-ScheduledTaskInfo; throw 'the office did not answer on port 4455' }
          Write-Host 'installer ok'
  site:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - name: Build the site (landing page and the live demo)
        run: sh scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  publish:
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
