<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-t>Office</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head>
<body><div id="stage"></div>
<header><span id="conn" data-t>Connecting</span><span class="c working"><i class="dot"></i><b id="nWorking">0</b> <span data-t>working</span></span><button id="bell" aria-pressed="true" data-t>🔔 Alerts</button><button id="waitBtn" class="c waiting"><i class="dot"></i><b id="nWaiting">0</b> <span data-t>waiting for you</span></button><span class="c idle"><i class="dot"></i><b id="nIdle">0</b> <span data-t>idle</span></span><button id="settingsBtn" aria-label="Settings" title="Settings" data-t-aria-label="Settings" data-t-title="Settings">⚙</button></header>
<button id="toggle" aria-expanded="false" aria-controls="side" data-t>List</button>
<aside id="side" aria-label="All agents" data-t-aria-label="All agents"><input id="q" type="search" placeholder="Search agents" data-t-placeholder="Search agents" aria-label="Search for a session or an agent" data-t-aria-label="Search for a session or an agent"><div id="list"></div></aside>
<section id="detail" hidden aria-label="Details" data-t-aria-label="Details"><button id="close" aria-label="Close details" data-t-aria-label="Close details">✕</button><h2 id="dName"></h2><span id="dStatus"></span><div id="dNeed" hidden></div><div id="dActs"></div><div id="dLead"></div><div id="dTask"></div><dl id="dRows"></dl></section>
<section id="roomBox" hidden aria-label="People in the room" data-t-aria-label="People in the room"><button id="roomClose" aria-label="Close the room list" data-t-aria-label="Close the room list">✕</button><h2 id="rName"></h2><div id="rActs"></div><div id="rList"></div></section>
<div id="dock"><div class="tools"><button id="edit" aria-pressed="false" data-t>Design the office</button><button id="walkBtn" data-t>Walk as the manager</button><button id="auto" aria-pressed="false" data-t>Auto camera</button></div><section id="active" aria-label="Agents active now" data-t-aria-label="Agents active now"></section></div>
<aside id="editor" hidden aria-label="Design the office" data-t-aria-label="Design the office"></aside>
<button id="camBtn" aria-expanded="false" aria-controls="cam" data-t>Camera</button><nav id="cam" aria-label="Camera" data-t-aria-label="Camera"><div class="views" role="group" aria-label="Preset angle" data-t-aria-label="Preset angle"><button data-view="iso" data-t>Overview</button><button data-view="top" data-t>Top</button><button data-view="front" data-t>Front</button><button data-view="eye" data-t>Eye level</button></div>
<div class="pad"><button data-cam="up" aria-label="Tilt up" data-t-aria-label="Tilt up">▲</button><button data-cam="left" aria-label="Rotate left" data-t-aria-label="Rotate left">↺</button><button data-view="iso" aria-label="Whole office" data-t-aria-label="Whole office">⛶</button><button data-cam="right" aria-label="Rotate right" data-t-aria-label="Rotate right">↻</button><button data-cam="down" aria-label="Tilt down" data-t-aria-label="Tilt down">▼</button></div>
<div class="zoomrow"><button data-cam="out" aria-label="Zoom out" data-t-aria-label="Zoom out">−</button><input id="zoomer" type="range" min="0" max="1000" aria-label="Zoom" data-t-aria-label="Zoom"><button data-cam="in" aria-label="Zoom in" data-t-aria-label="Zoom in">+</button></div>
<div class="views" role="group" aria-label="What dragging does" data-t-aria-label="What dragging does"><button data-drag="pan" aria-pressed="true" data-t>Drag moves</button><button data-drag="rotate" aria-pressed="false" data-t>Drag rotates</button></div></nav><div id="rooms" role="toolbar" aria-label="Switch rooms" data-t-aria-label="Switch rooms"></div><div id="float" hidden role="toolbar" aria-label="Item actions" data-t-aria-label="Item actions"></div><div id="walk" hidden><div id="cross"></div><b id="walkName"></b><button id="walkNear" hidden></button><div id="walkDo" hidden></div><div id="walkTask" hidden><span></span><textarea rows="2" maxlength="800" placeholder="What should it do? Enter to send, Esc to cancel" data-t-placeholder="What should it do? Enter to send, Esc to cancel" aria-label="Task for the agent" data-t-aria-label="Task for the agent"></textarea><button data-t>Send</button></div><p id="walkHint" data-t>Up and down arrows: walk · Left and right: turn · Mouse drag: look · Shift run · E session · T task · F sit · Esc exit</p><button id="lookBtn" aria-expanded="false" aria-controls="studio" data-t>Customize character</button><div id="studio" hidden></div><div class="wtools"><button id="walkExit" data-t>Exit</button></div><div id="joy" aria-hidden="true"><i></i></div></div><div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script></body></html>
